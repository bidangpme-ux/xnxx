    <script>
      // Ignore HMR WebSocket connection errors as HMR is disabled in AI Studio
      window.addEventListener('error', function (e) {
        if (
          e.message &&
          (e.message.includes('WebSocket') ||
            e.message.includes('createWebSocketModuleRunnerTransport') ||
            e.message.includes('@vite/client'))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var str = String(e.reason || '');
        if (str.includes('WebSocket') || str.includes('createWebSocketModuleRunnerTransport')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
